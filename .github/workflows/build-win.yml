name: Build Windows Launcher

# Déclencheurs :
# - push sur main -> build + publication automatique dans la Release "latest-build"
#   (remplace l'exe précédent, pas besoin d'aller le chercher dans le Summary)
# - tag "v*.*.*" (ex. v3.3.9) -> build + Release GitHub versionnée dédiée
# - pull request vers main -> build de vérification uniquement (pas de Release)
# - déclenchement manuel depuis l'onglet Actions
on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  # Chemin vers le .csproj du launcher. À adapter si le fichier ne se trouve
  # pas à la racine du dépôt (ex. "src/AzerothUniverseLauncher/AzerothUniverseLauncher.csproj").
  PROJECT_PATH: "AzerothUniverseLauncher.csproj"
  PUBLISH_DIR: "publish"
  RUNTIME_ID: "win-x64"

jobs:
  build:
    name: Build & Publish
    # WPF/WinForms ne peuvent être compilés que sur un agent Windows.
    runs-on: windows-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache des paquets NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restaurer les dépendances
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Compiler (Release)
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Publier (autonome, exécutable unique, win-x64)
        run: >
          dotnet publish "${{ env.PROJECT_PATH }}"
          --configuration Release
          --runtime ${{ env.RUNTIME_ID }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=false
          --output "${{ env.PUBLISH_DIR }}"

      - name: Uploader l'artefact de build
        uses: actions/upload-artifact@v4
        with:
          name: AzerothUniverseLauncher-${{ env.RUNTIME_ID }}
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error

  release:
    name: Publier dans une Release GitHub
    needs: build
    # Jamais sur une pull request (pas de token d'écriture, et on ne veut pas
    # publier une release depuis une branche non fusionnée).
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Télécharger l'artefact de build
        uses: actions/download-artifact@v4
        with:
          name: AzerothUniverseLauncher-${{ env.RUNTIME_ID }}
          path: ${{ env.PUBLISH_DIR }}

      - name: Déterminer le tag de la Release
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            # Push d'un tag de version (ex. v3.3.9) -> Release officielle dédiée
            echo "tag_name=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
            echo "release_name=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
            echo "prerelease=false" >> $env:GITHUB_OUTPUT
          } else {
            # Simple push sur main (ou déclenchement manuel) -> Release "dernier build"
            # réutilisée et mise à jour à chaque exécution (mêmes tag/nom).
            echo "tag_name=latest-build" >> $env:GITHUB_OUTPUT
            echo "release_name=Dernier build (main)" >> $env:GITHUB_OUTPUT
            echo "prerelease=true" >> $env:GITHUB_OUTPUT
          }

      - name: Compresser le build
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ env.PUBLISH_DIR }}\*" -DestinationPath "AzerothUniverseLauncher-${{ steps.tag.outputs.tag_name }}-${{ env.RUNTIME_ID }}.zip"

      - name: Publier / mettre à jour la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.release_name }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          make_latest: ${{ steps.tag.outputs.tag_name != 'latest-build' }}
          files: AzerothUniverseLauncher-${{ steps.tag.outputs.tag_name }}-${{ env.RUNTIME_ID }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
