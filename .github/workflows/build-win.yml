name: Build Windows Launcher

# Déclencheurs :
# - push sur main -> build de vérification
# - tag "v*.*.*" (ex. v3.3.9) -> build + création d'une Release GitHub avec le zip attaché
# - pull request vers main -> build de vérification
# - déclenchement manuel depuis l'onglet Actions
on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  # Chemin vers le .csproj du launcher. À adapter si le fichier ne se trouve
  # pas à la racine du dépôt (ex. "src/AzerothUniverseLauncher/AzerothUniverseLauncher.csproj").
  PROJECT_PATH: "AzerothUniverseLauncher.csproj"
  PUBLISH_DIR: "publish"
  RUNTIME_ID: "win-x64"

jobs:
  build:
    name: Build & Publish
    # WPF/WinForms ne peuvent être compilés que sur un agent Windows.
    runs-on: windows-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache des paquets NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restaurer les dépendances
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Compiler (Release)
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Publier (autonome, exécutable unique, win-x64)
        run: >
          dotnet publish "${{ env.PROJECT_PATH }}"
          --configuration Release
          --runtime ${{ env.RUNTIME_ID }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=false
          --output "${{ env.PUBLISH_DIR }}"

      - name: Uploader l'artefact de build
        uses: actions/upload-artifact@v4
        with:
          name: AzerothUniverseLauncher-${{ env.RUNTIME_ID }}
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error

  release:
    name: Créer la Release GitHub
    needs: build
    # Ne s'exécute que lors d'un push de tag "v*.*.*" (ex. v3.3.9)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Télécharger l'artefact de build
        uses: actions/download-artifact@v4
        with:
          name: AzerothUniverseLauncher-${{ env.RUNTIME_ID }}
          path: ${{ env.PUBLISH_DIR }}

      - name: Compresser le build
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ env.PUBLISH_DIR }}\*" -DestinationPath "AzerothUniverseLauncher-${{ github.ref_name }}-${{ env.RUNTIME_ID }}.zip"

      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          files: AzerothUniverseLauncher-${{ github.ref_name }}-${{ env.RUNTIME_ID }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
